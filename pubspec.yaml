name: fintech_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  loading_animation_widget: ^1.3.0
  fluttertoast: ^9.0.0
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3
  bloc: ^9.1.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dart_either: ^2.0.0
  dio: ^5.9.0
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^5.2.1
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  flutter_stripe: ^12.1.1
  flutter_svg: ^2.2.2
  freezed_annotation: ^3.1.0
  get_it: ^9.0.5
  google_fonts: ^6.3.3
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  mocktail: ^1.0.4
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.1
  retrofit_generator: ^10.2.0
  skeletonizer: ^2.1.0+1
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  build_runner: ^2.10.4
  freezed: ^3.2.3
  hive_ce_generator: ^1.6.0

  flutter_launcher_icons: "^0.14.4"

  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/logoLightImage.png"

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/svg/
    - assets/videos/
    - .env

  # example:
  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf
